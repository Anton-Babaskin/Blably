name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: for f in *.js; do node --check "$f"; done

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest *.js app.css audio brand fonts _site/
          mkdir -p _site/docs && cp -r docs/design-review _site/docs/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
